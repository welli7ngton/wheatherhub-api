services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WEATHERHUB_APP_NAME: ${WEATHERHUB_APP_NAME:-WeatherHub API}
      WEATHERHUB_DEBUG: ${WEATHERHUB_DEBUG:-false}
      WEATHERHUB_WEATHER_PROVIDER_BASE_URL: ${WEATHERHUB_WEATHER_PROVIDER_BASE_URL:-https://api.open-meteo.com}
      WEATHERHUB_WEATHER_PROVIDER_CONNECT_TIMEOUT: ${WEATHERHUB_WEATHER_PROVIDER_CONNECT_TIMEOUT:-5}
      WEATHERHUB_WEATHER_PROVIDER_READ_TIMEOUT: ${WEATHERHUB_WEATHER_PROVIDER_READ_TIMEOUT:-10}
      WEATHERHUB_WEATHER_PROVIDER_WRITE_TIMEOUT: ${WEATHERHUB_WEATHER_PROVIDER_WRITE_TIMEOUT:-5}
      WEATHERHUB_WEATHER_PROVIDER_POOL_TIMEOUT: ${WEATHERHUB_WEATHER_PROVIDER_POOL_TIMEOUT:-5}
